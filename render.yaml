services:
  - type: web
    name: field-test-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
        # After the frontend is deployed, update this in the Render
        # dashboard to your real Vercel URL, e.g.:
        # https://your-frontend.vercel.app
